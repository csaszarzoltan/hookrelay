[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hookrelay"
version = "1.5.0"
description = "Webhook relay tool for local development. CLI-first webhook debugging, payload inspection, replay, and SSRF protection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Micro-SaaS Lab" }]
keywords = ["webhook", "relay", "debugging", "cli", "tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "typer>=0.12,<1",
    "websocket-client>=1.8,<2",
    "requests>=2.32,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3.1,<4",
    "jsonschema[format-nongpl]>=4.26,<5",
    "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.24", "httpx2>=2.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/csaszarzoltan/hookrelay"
Repository = "https://github.com/csaszarzoltan/hookrelay"

[project.scripts]
hookrelay = "hookrelay.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
lint.ignore = ["BLE001", "S110"]


